# Include inside the fnOS server block. Keep the private /app/node-space
# gateway unchanged. No NAS identity or login cookies reach these routes.

location ^~ /app/node-space/s/ {
    if ($uri !~ "^/app/node-space/s/[a-f0-9]{48}/?$") { return 404; }
    if ($request_method != GET) { return 405; }
    auth_request off;
    proxy_pass http://unix:/run/node-space-share/app.sock;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header Content-Length "";
    proxy_hide_header Set-Cookie;
    proxy_cache off;
}

location ^~ /app/node-space/api/public/ {
    if ($uri !~ "^/app/node-space/api/public/[a-f0-9]{48}(/attachment)?$") { return 404; }
    if ($request_method != GET) { return 405; }
    auth_request off;
    proxy_pass http://unix:/run/node-space-share/app.sock;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Share-Password $http_x_share_password;
    proxy_set_header Connection "";
    proxy_set_header Content-Length "";
    proxy_hide_header Set-Cookie;
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

location ^~ /app/node-space/assets/ {
    if ($uri !~ "^/app/node-space/assets/[A-Za-z0-9_.-]+$") { return 404; }
    if ($request_method != GET) { return 405; }
    auth_request off;
    proxy_pass http://unix:/run/node-space-share/app.sock;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header Content-Length "";
    proxy_hide_header Set-Cookie;
    proxy_cache off;
}
